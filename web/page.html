<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="color-scheme" content="light dark">
  <title>$title · Tech News</title>
  <script>try{var theme=localStorage.getItem('tech-news-theme');if(theme==='light'||theme==='dark')document.documentElement.dataset.theme=theme;}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="$favicon">
  <link rel="stylesheet" href="$stylesheet">
  <script src="$script" defer></script>
</head>
<body class="$page_class" id="top">
  <a class="skip-link" href="#content">跳至主要內容</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="$home" aria-label="Tech News 首頁"><span class="brand-mark" aria-hidden="true">tn<span>.</span></span><span class="brand-name">Tech News<span class="brand-subtitle">技術論文與深度閱讀</span></span></a>
      <div class="header-actions"><a class="search-link" aria-label="搜尋內容" href="$search_url"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>搜尋內容</span></a><button class="theme-toggle enhanced-only" type="button" aria-label="切換深色模式" aria-pressed="false"><span aria-hidden="true">◐</span></button></div>
    </div>
    <div class="topbar"><nav aria-label="主要導覽">$primary_navigation</nav><span class="topbar-note">持續收錄，慢慢讀懂。</span></div>
  </header>
  <div class="site-layout">
    <aside class="site-sidebar"><details class="site-navigation" open><summary>瀏覽主題與標籤 <span aria-hidden="true">＋</span></summary><div class="navigation-content">$navigation</div></details></aside>
    <main id="content" tabindex="-1">$content</main>
  </div>
  <footer class="site-footer"><div><strong>Tech News<span>.</span></strong><p>留下值得理解的方法、觀點與問題。</p></div><div class="footer-links"><a href="https://github.com/Oxoi5583/tech-news">GitHub ↗</a><a href="#top">回到頂部 ↑</a></div></footer>
</body>
</html>
